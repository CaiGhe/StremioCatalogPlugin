name: Cap nhat catalog
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Fetch catalog + link phát
        run: node fetch.js
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          STREAM_VERIFY: '0'
      - run: node build.js
      - name: Commit & push catalog + link phát
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog manifest.json
          if [ -d stream ]; then git add stream; fi
          if [ -f search-index.json ]; then git add search-index.json; fi
          git diff --cached --quiet || git commit -m "Cap nhat catalog $(date -u +%F)"
          git push
